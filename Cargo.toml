[workspace]
resolver = "2"
members = [
    "crates/ui-core",
    "crates/ui-renderer",
    "crates/ui-window",
    "crates/ui-text",
    "crates/ui-runtime",
    "examples/basic",
    "examples/diagnostic",
    "examples/stress",
    "examples/runtime_demo",
    "examples/interaction_bench",
    "examples/text_editing_demo",
    "examples/accessibility_demo",
    "examples/primitives_demo",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
arboard = { version = "3.6.1", default-features = false }
bytemuck = { version = "1.24", features = ["derive"] }
pollster = "0.4"
raw-window-handle = "0.6"
wgpu = "30.0.1"
winit = "0.30.12"
accesskit = "0.25.1"
accesskit_winit = "0.34.0"
cosmic-text = "0.19.0"
unicode-segmentation = "1.12.0"
fontdb = "0.23.0"
swash = "0.2.10"
